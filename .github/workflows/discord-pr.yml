name: Discord PR Notification

on:
  pull_request:
    types:
      - opened

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord Message
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d "{
            \"content\":\"🚀 Novo Pull Request\n\n📦 Projeto: ${{ github.repository }}\n👤 Autor: ${{ github.actor }}\n🔗 ${{ github.event.pull_request.html_url }}\n\n👀 Precisa de aprovação\"
          }" \
          ${{ secrets.DISCORD_WEBHOOK }}